[bootstrap.mise_shell_activate]
zsh = true
# ~/.zshrc is a symlink into ~/.dotfiles/zsh, so mise can't edit it.
# The activation block lives in the repo file instead.
zshrc = false

[bootstrap.packages]
"dnf:gcc" = "latest"                  # cc — Rust linker, required by cargo:wpaperd
"dnf:gcc-c++" = "latest"
"dnf:make" = "latest"
"dnf:pkgconf-pkg-config" = "latest"    # pkg-config — finds .pc files for native deps
"dnf:libxcb-devel" = "latest"          # needed by wpaperd
"dnf:libxkbcommon-devel" = "latest"    # needed by wpaperd
"dnf:openssl-devel" = "latest"
"dnf:postgresql-server" = "latest"
"dnf:wayland-devel" = "latest"     # wayland-client.pc — needed by wpaperd
"dnf:fontconfig-devel" = "latest"  # needed by wpaperd
"dnf:mesa-libEGL-devel" = "latest" # egl.pc — needed by wpaperd transitions


[bootstrap.repos]
"~/kjaymiller.com" = { url = "git@github.com:kjaymiller/kjaymiller.com.git" }

[tools]
1password = "latest"
1password-cli = "latest"
age = "latest"
atuin = "latest"
bat-extras = "latest"
betterleaks = "latest"
bat = "latest"
btop = "latest"
cloudflared = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
flyctl = "latest"
fnox = "latest"
fzf = "latest"
"http:fzf-tab" = { version = "1.3.0", url = "https://github.com/aloxaf/fzf-tab/archive/refs/tags/v1.3.0.tar.gz" }
"http:fzf-git" = { version = "57ef995e245923ae05721e876c42100a1896ad6c", url = "https://raw.githubusercontent.com/junegunn/fzf-git.sh/57ef995e245923ae05721e876c42100a1896ad6c/fzf-git.sh" }
gh = "latest"
glow = "latest"
gum = "latest"
neovim = "latest"
"aqua:iffse/pay-respects" = "latest"
pi = "latest"
starship = "latest"
zellij = "latest"
zoxide = "latest"
"aqua:dylanaraps/neofetch" = "latest"
uv = "latest"
rust = "latest"
"cargo:wpaperd" = "latest"


[dotfiles]
"~/.zshrc" = "~/.dotfiles/zsh/.zshrc"
