# ~/.config/fuzzel/fuzzel.ini
# Catppuccin Mocha palette

font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
terminal=zellij
icon-theme=Adwaita

horizontal-pad=30
vertical-pad=12
inner-pad=8

[border]
width=2
radius=12

[colors]
background=1e1e2edd   # base
text=cdd6f4ff         # text
match=f38ba8ff        # red - matched substring
selection=89b4faff    # blue - border/selection
selection-text=1e1e2eff
selection-match=f38ba8ff
placeholder=6c7086ff  # overlay0
border=a979ecff

# active-color "hsl(265 75% 70%)"
# inactive-color "hsl(265 25% 35%)"
